<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OrganicSMM Pro</title>
<style>
  :root {
    --bg: #0b0b0f;
    --bg-2: #12121a;
    --fg: #ffffff;
    --muted: #a1a1aa;
    --brand: #f97316;
    --brand-2: #fb923c;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 400px; height: 600px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    overflow: hidden;
  }
  .app { width: 100%; height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    background: linear-gradient(180deg, #12121a 0%, #0b0b0f 100%);
    border-bottom: 1px solid var(--border);
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .brand span { font-size: 13px; font-weight: 700; letter-spacing: 0.2px; }
  .tools { display: flex; gap: 4px; }
  button.icon {
    all: unset;
    cursor: pointer;
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px;
    color: var(--muted);
    transition: background 120ms ease, color 120ms ease;
  }
  button.icon:hover { background: rgba(255,255,255,0.06); color: var(--fg); }
  button.icon svg { width: 16px; height: 16px; }
  .frame-wrap { position: relative; flex: 1; background: var(--bg); }
  iframe {
    width: 100%; height: 100%;
    border: 0; background: var(--bg);
    display: block;
  }
  .loader {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px;
    background: var(--bg);
    transition: opacity 200ms ease;
  }
  .loader.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 28px; height: 28px;
    border: 2.5px solid rgba(255,255,255,0.12);
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin 700ms linear infinite;
  }
  .loader small { color: var(--muted); font-size: 11px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <img src="icons/icon48.png" alt="OrganicSMM" />
        <span>OrganicSMM Pro</span>
      </div>
      <div class="tools">
        <button class="icon" id="btn-refresh" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.3L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
        <button class="icon" id="btn-panel" title="Open side panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
        </button>
        <button class="icon" id="btn-open" title="Open in new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
        </button>
      </div>
    </header>
    <div class="frame-wrap">
      <div class="loader" id="loader"><div class="spinner"></div><small>Loading OrganicSMM Pro…</small></div>
      <iframe id="app" src="about:blank" allow="clipboard-read; clipboard-write; payment" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
